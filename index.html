<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="theme-color" content="#f7f1e7">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Una pequeña experiencia de cumpleaños.">
    <title>Para C</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./content.js" defer></script>
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div class="ambient-mark ambient-mark--one" aria-hidden="true"></div>
    <div class="ambient-mark ambient-mark--two" aria-hidden="true"></div>

    <main class="experience" id="experience">
      <section class="scene scene--entry is-active" data-scene="entry" aria-labelledby="entry-title">
        <div class="scene__inner scene__inner--center">
          <p class="eyebrow" id="entry-kicker"></p>
          <h1 class="initial" id="entry-title" tabindex="-1"></h1>
          <div class="opening-copy">
            <p class="lead" id="entry-lead"></p>
            <p class="subtle" id="entry-note"></p>
          </div>
          <button class="button button--primary" id="entry-open" type="button"></button>
        </div>
      </section>

      <section class="scene scene--memory" data-scene="memory" aria-labelledby="memory-title" hidden>
        <div class="scene__inner scene__inner--narrow">
          <p class="scene-number" id="memory-number" aria-hidden="true"></p>
          <h2 id="memory-title" tabindex="-1"></h2>
          <p class="memory-prompt" id="memory-prompt"></p>
          <div class="quiet-rule" aria-hidden="true"><span></span></div>
          <button class="button button--secondary delayed-control" id="memory-continue" type="button" disabled></button>
        </div>
      </section>

      <section class="scene scene--choice" data-scene="choice" aria-labelledby="choice-title" hidden>
        <div class="scene__inner scene__inner--wide">
          <p class="scene-number" id="choice-number" aria-hidden="true"></p>
          <h2 id="choice-title" tabindex="-1"></h2>
          <div class="choices" id="choices" role="group" aria-labelledby="choice-title"></div>
          <p class="choice-feedback" id="choice-feedback" aria-live="polite" aria-atomic="true"></p>
          <button class="button button--primary choice-open" id="choice-open" type="button" hidden></button>
        </div>
      </section>

      <section class="scene scene--message" data-scene="message" aria-labelledby="message-title" hidden>
        <article class="message-card">
          <div class="message-marker" aria-hidden="true"></div>
          <h2 class="message-title" id="message-title" tabindex="-1"></h2>
          <div class="message-body" id="message-body"></div>
          <p class="message-closing" id="message-closing"></p>
        </article>
      </section>
    </main>
  </body>
</html>
